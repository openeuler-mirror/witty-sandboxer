[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-policy"
version = "0.1.0"
description = "命令分类与 linux-sandbox 策略生成，供行为安全插件独立调用"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
sandbox-policy = "sandbox_policy.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel.force-include]
"src/sandbox_policy/rules.yaml" = "sandbox_policy/rules.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
